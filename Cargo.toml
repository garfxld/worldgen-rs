[package]
name = "worldgen-rs"
version = "0.1.0"
edition = "2024"
description = "Minecraft world generation library"
license = "Apache-2.0"
repository = "https://github.com/garfxld/worldgen-rs"

[lib]
name = "worldgen_rs"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"

thiserror = "2.0.19"
tracing = "0.1.44"

rustc-hash = "2.1.3"
smallvec = { version = "1.15.2", features = ["const_generics"] }
glam = { version = "0.33.2", features = ["serde"] }

parking_lot = { version = "0.12.5", features = ["nightly", "arc_lock"] }
rayon = "1.12.0"
arc-swap = "1.9.2"
scc = "3.8.5"

cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-jit = "0.134"
cranelift-module = "0.134"
cranelift-native = "0.134"

flate2 = "1.1.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sha2 = "0.10.9"
simdnbt = "0.10"

[build-dependencies]
heck = "0.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
criterion = "0.8.2"
cerium = { path = "../cerium/cerium" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true

[profile.bench]
debug = true

[profile.dev]
opt-level = 3
codegen-units = 16
debug = 0

[profile.dev.package.worldgen-rs]
debug-assertions = false
overflow-checks = false

[lints.clippy]
absolute_paths = "warn"
missing_const_for_fn = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

all = { level = "warn", priority = -1 }
unwrap_used = { level = "warn", priority = -2 }
